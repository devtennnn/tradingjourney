<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img" aria-label="AROM TRADE">
  <!-- AROM TRADE app icon — lime mark on a forest-green tile (favicon, social, app stores) -->
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a2a"/>
      <stop offset="1" stop-color="#0b1813"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx=".78" cy=".2" r=".7">
      <stop offset="0" stop-color="#b9f25a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b9f25a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai-lime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fc23e"/>
      <stop offset=".55" stop-color="#b9f25a"/>
      <stop offset="1" stop-color="#e3ffa8"/>
    </linearGradient>
    <mask id="ai-cut">
      <rect x="0" y="0" width="1000" height="1000" fill="#fff"/>
      <rect x="590" y="618" width="150" height="36" fill="#000"/>
      <rect x="712" y="0" width="300" height="1000" fill="#000"/>
    </mask>
  </defs>
  <rect width="1000" height="1000" rx="220" fill="url(#ai-bg)"/>
  <rect width="1000" height="1000" rx="220" fill="url(#ai-glow)"/>
  <rect x="6" y="6" width="988" height="988" rx="216" fill="none" stroke="#d6ff86" stroke-opacity=".18" stroke-width="12"/>
  <g transform="translate(500 500) scale(1.22) translate(-492 -501)" mask="url(#ai-cut)">
    <path d="M 295 240 H 712 V 618 H 604 V 348 H 295 Z" fill="url(#ai-lime)"/>
    <path d="M 658 294 L 327 572 A 79 79 0 0 0 378 708 H 750" fill="none" stroke="url(#ai-lime)" stroke-width="108" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>
</svg>
