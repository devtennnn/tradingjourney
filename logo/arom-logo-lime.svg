<svg xmlns="http://www.w3.org/2000/svg" viewBox="196 205 592 592" width="100%" height="100%" role="img" aria-label="AROM TRADE">
  <!-- AROM TRADE mark — lime gradient on transparent (for dark green backgrounds) -->
  <defs>
    <linearGradient id="arom-lime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fc23e"/>
      <stop offset=".55" stop-color="#b9f25a"/>
      <stop offset="1" stop-color="#e3ffa8"/>
    </linearGradient>
    <mask id="arom-cut">
      <rect x="0" y="0" width="1000" height="1000" fill="#fff"/>
      <rect x="590" y="618" width="150" height="36" fill="#000"/>
      <rect x="712" y="0" width="300" height="1000" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#arom-cut)">
    <path d="M 295 240 H 712 V 618 H 604 V 348 H 295 Z" fill="url(#arom-lime)"/>
    <path d="M 658 294 L 327 572 A 79 79 0 0 0 378 708 H 750" fill="none" stroke="url(#arom-lime)" stroke-width="108" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>
</svg>
