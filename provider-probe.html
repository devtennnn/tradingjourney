<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Provider test · AROM TRADE</title>
<meta name="theme-color" content="#07110c">
<style>
:root{--bg:#07110c;--panel:#13261f;--line:#2a4636;--lime:#b9f25a;--text:#eef6f0;--muted:#93ab9c;--red:#f05b78;--green:#34d399;--amber:#f5b942}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 48px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:6px 0 4px}p{color:var(--muted);margin:0 0 12px;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-weight:700;padding:11px 14px;border-radius:11px;min-height:44px}
button.pri{background:var(--lime);color:#0b1813;border-color:var(--lime)}button:disabled{opacity:.5}
#st{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:13.5px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 14px}th,td{padding:6px 6px;border-bottom:1px solid rgba(42,70,54,.6);text-align:left;vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.note{color:var(--muted);word-break:break-word}
h2{font-size:14px;color:var(--lime);margin:16px 0 4px}.sc{overflow-x:auto}
textarea{width:100%;height:120px;background:#0c1a14;color:var(--text);border:1px solid var(--line);border-radius:10px;font:12px monospace;padding:8px}
</style>
</head>
<body>
<h1>Market-data provider test</h1>
<p>Admin only. Runs on the server with the keys stored in Vercel and shows which symbols each provider really serves, how fresh the data is and any plan or rate-limit errors. Nothing is saved.</p>
<div id="st">Checking sign-in…</div>
<div class="row" id="btns" hidden>
  <button class="pri" data-p="siftingio" data-q="&symbols=NAS100,US30,SPX500,GER40">SiftingIO indices (slow, ~2 min)</button>
  <button class="pri" data-p="siftingio">SiftingIO all</button>
  <button class="pri" data-p="finnhub">Finnhub</button>
  <button class="pri" data-p="twelvedata">Twelve Data</button>
  <button class="pri" data-p="alphavantage">Alpha Vantage</button>
  <button class="pri" data-p="marketaux">Marketaux</button>
</div>
<div class="row" id="mdBtns" hidden>
  <button class="pri" id="mdRun">Test market-data function (gold, EURUSD, QQQ)</button>
  <button id="mdHealth">Show quota and health</button>
  <button class="pri" id="miRun">Analyse XAUUSD M15 (indicators, structure, levels)</button>
  <button class="pri" id="miRun2">Analyse BTCUSD H1</button>
  <button id="aiModels">List the OpenAI models my key can use</button>
  <button class="pri" id="aiRun">AROM AI: analyst report XAUUSD M15</button>
  <button class="pri" id="aiBrief">AROM AI: daily market briefing (10 instruments)</button>
  <button class="pri" id="aiBriefS">AROM AI: session briefing</button>
  <button class="pri" id="aiNews">AROM AI: news explainer (gold)</button>
  <button class="pri" id="aiChat">AROM AI: ask "What is the current gold bias?"</button>
</div>
<div id="out"></div>
<div id="cp" hidden><h2>Copy and paste this to Claude</h2><textarea id="ta" readonly></textarea><div class="row"><button id="copy">Copy results</button></div></div>
<script src="/vendor/supabase-2.119.0.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb = window.supabase.createClient('https://sksvwikfyrdhgjngekqp.supabase.co', 'sb_publishable_9HxgkobAgQtKb2Jx8dkX-A_DxWy_m6e');
const ALL = {}; let token = '';
(async () => {
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $('st').innerHTML = 'You are not signed in. Open <a href="/" style="color:var(--lime)">aromx.trade</a>, sign in with your admin account, then come back to this page.'; return; }
  token = session.access_token; $('mdBtns').hidden = false; $('st').textContent = 'Signed in. Tap a provider to test it (each takes up to about a minute).'; $('btns').hidden = false;
})();
async function run(p, btn, q){
  btn.disabled = true; $('st').textContent = 'Testing ' + p + '… please wait, do not close the page.';
  try{
    const r = await fetch('/api/provider-probe?providers=' + p + (q || ''), {headers:{Authorization:'Bearer ' + token}});
    const j = await r.json().catch(() => ({}));
    if(r.status === 403){ $('st').textContent = 'This account is not an admin (or the session expired). Sign in again as admin.'; btn.disabled = false; return; }
    if(r.status === 404){ $('st').textContent = 'The test endpoint is not deployed yet. Merge the pull request and wait for the Vercel deploy.'; btn.disabled = false; return; }
    if(!r.ok){ $('st').textContent = 'Test failed (HTTP ' + r.status + '). It may have timed out; try again.'; btn.disabled = false; return; }
    ALL[p + (q ? ' (indices)' : '')] = j; show(); $('st').textContent = j.skipped_no_key && j.skipped_no_key.length ? p + ': no API key is set in Vercel for this provider.' : 'Done: ' + p + '.';
  }catch(e){ $('st').textContent = 'Could not reach the server. Check your connection and try again.'; }
  btn.disabled = false;
}
function show(){
  let html = '', plain = [];
  for(const [p, j] of Object.entries(ALL)){
    html += '<h2>' + esc(p) + '</h2>';
    if(j.skipped_no_key && j.skipped_no_key.length){ html += '<p>No key configured.</p>'; plain.push(p + ': no key'); continue; }
    html += '<div class="sc"><table><tr><th>Symbol</th><th>OK</th><th>Fresh</th><th>Price</th><th>Candles</th><th>ms</th><th>Note</th></tr>' + j.rows.map(r =>
      '<tr><td>' + esc(r.symbol) + '</td><td class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? 'yes' : 'no') + '</td><td>' + esc(r.freshness || '') + (r.age_s != null ? ' (' + r.age_s + 's)' : '') + '</td><td>' + esc(r.price == null ? '' : r.price) + '</td><td>' + esc(r.n == null ? '' : r.n) + '</td><td>' + esc(r.ms == null ? '' : r.ms) + '</td><td class="note">' + esc(r.note || '') + '</td></tr>').join('') + '</table></div>';
    plain.push(p + ' | ' + j.rows.map(r => [r.symbol, r.ok ? 'OK' : 'NO', r.freshness || '', r.age_s != null ? r.age_s + 's' : '', r.n != null ? r.n + ' candles' : '', r.ms != null ? r.ms + 'ms' : '', r.note || ''].filter(Boolean).join(' ')).join(' ; '));
  }
  $('out').innerHTML = html; $('ta').value = plain.join('\n\n'); $('cp').hidden = !plain.length;
}

/* test of the deployed market-data function (the one AROM AI will use): real calls through the shared cache */
async function mdCall(body){
  const {data, error} = await sb.functions.invoke('market-data', {body});
  if(error){ let code = ''; try{ const j = await error.context.json(); code = j && j.error || ''; }catch(e){} return {error: code || 'http_error'}; }
  return data;
}
function mdShow(title, lines){ ALL[title] = {rows: [], plain: lines}; const o = $('out'); const d = document.createElement('div'); d.innerHTML = '<h2>' + esc(title) + '</h2><pre style="white-space:pre-wrap;word-break:break-word;font-size:12.5px;color:#cfe0d5">' + esc(lines.join('\n')) + '</pre>'; o.prepend(d); const ta = $('ta'); ta.value = title + '\n' + lines.join('\n') + '\n\n' + ta.value; $('cp').hidden = false; }
$('mdRun').onclick = async () => {
  const b = $('mdRun'); b.disabled = true; $('st').textContent = 'Calling market-data… (first calls take a few seconds)';
  const L = [];
  for(const [name, body] of [['quote EURUSD', {action:'quote', symbol:'EURUSD'}], ['candles XAUUSD M5', {action:'candles', symbol:'XAUUSD', timeframe:'M5', limit:200}], ['candles XAUUSD H4', {action:'candles', symbol:'XAUUSD', timeframe:'H4', limit:100}], ['candles NAS100 M15 (default = NQ futures)', {action:'candles', symbol:'NAS100', timeframe:'M15', limit:100}], ['candles NAS100 M15 (ETF variant)', {action:'candles', symbol:'NAS100', timeframe:'M15', limit:100, variant:'etf'}], ['candles BTCUSD M15', {action:'candles', symbol:'BTCUSD', timeframe:'M15', limit:200}], ['candles XAUUSD M5 again (should come from cache)', {action:'candles', symbol:'XAUUSD', timeframe:'M5', limit:200}]]){
    const r = await mdCall(body);
    if(r.error){ L.push(name + ': ERROR ' + r.error); continue; }
    if(r.quote){ const q = r.quote; L.push(name + ': price ' + q.price + ' bid ' + q.bid + ' ask ' + q.ask + ' time ' + q.timestamp + ' stale ' + q.is_stale + ' cache ' + r.meta.from_cache + (r.meta.reason ? ' reason ' + r.meta.reason : '')); }
    else { const m = r.meta, c = r.candles, l = c[c.length - 1]; L.push(name + ': ' + c.length + ' candles, last ' + (l ? l.timestamp + ' close ' + l.close + ' complete ' + l.complete : '-') + ', age ' + m.last_candle_age_s + 's, dropped ' + m.dropped_invalid + ', cache ' + m.from_cache + (m.served_stale ? ' STALE ' + m.reason : '') + ', ' + r.instrument.symbol + '/' + r.instrument.asset_class + (r.instrument.tracks ? ' tracks ' + r.instrument.tracks : '') + (m.derived ? ' derived' : '') + ', truncated ' + m.truncated + ', source ' + m.source + (m.is_delayed ? ' DELAYED' : '')); }
  }
  mdShow('market-data function', L); $('st').textContent = 'Done.'; b.disabled = false;
};
$('mdHealth').onclick = async () => {
  const r = await mdCall({action:'health'});
  if(r.error){ mdShow('market-data health', ['ERROR ' + r.error]); return; }
  mdShow('market-data health', r.providers.map(h => h.provider + ': status ' + h.status + ', quota ' + h.quota_remaining + '/' + h.quota_limit + ', calls today ' + h.calls_today + ', errors today ' + h.errors_today + ', last ok ' + h.last_success_at + (h.last_error ? ', last error ' + h.last_error + ' at ' + h.last_error_at : '') + ', reserve ' + h.reserve).concat(['key configured: ' + r.configured.siftingio]));
};

async function miAnalyse(sym, tf){
  const {data, error} = await sb.functions.invoke('market-intelligence', {body:{symbol:sym, timeframe:tf}});
  if(error){ let code = ''; try{ const j = await error.context.json(); code = j && j.error || ''; }catch(e){} return ['ERROR ' + (code || 'http_error')]; }
  const a = data, L = [];
  if(!a.available){ return [sym + ' ' + tf + ': NOT AVAILABLE — ' + a.reason]; }
  const e = a.indicators.ema, m = a.indicators.macd, lv = a.levels;
  L.push(sym + ' ' + tf + ' · source ' + a.source + ' · calculated ' + a.calculated_at);
  L.push('BIAS ' + (a.bias || 'WITHHELD') + ' · evidence score ' + a.evidence_score + ' · confidence ' + a.confidence + ' (no validated model)');
  L.push('price ' + (a.indicators ? '' : '') + 'last close, VWAP ' + (a.indicators.vwap.value == null ? 'unavailable (' + a.indicators.vwap.reason + ')' : a.indicators.vwap.value + ' [' + a.indicators.vwap.volume_kind + ']'));
  L.push('last candle ' + a.last_candle_at + ' · freshness ' + a.freshness.status + ' (' + a.freshness.age_s + 's) · session ' + a.session.name + ' · Phnom Penh ' + a.session.phnom_penh);
  L.push('candles used ' + a.data.candles_used + (a.data.forming_candle_excluded ? ' (forming candle excluded)' : '') + ' · EMA200 sufficient ' + a.data.sufficient_for_ema200 + ' · unavailable: ' + (a.data.unavailable.join('; ') || 'none'));
  L.push('EMA 9/20/50/100/200: ' + [9,20,50,100,200].map(k => e[k]).join(' / ') + ' · stack ' + a.indicators.ema_stack);
  L.push('RSI14 ' + a.indicators.rsi + ' (' + a.momentum.rsi_zone + ') · MACD hist ' + m.histogram + ' (' + a.momentum.macd_histogram_direction + ') · ATR14 ' + a.indicators.atr14 + ' (' + a.volatility.percent + '%, ' + a.volatility.regime + ' volatility)');
  L.push('trend short ' + a.trend.short + ' / medium ' + a.trend.medium + ' · structure ' + a.structure.trend + ' ' + a.structure.swing_labels.join('+') + (a.structure.last_break ? ' · last ' + a.structure.last_break.type + ' ' + a.structure.last_break.direction + ' @ ' + a.structure.last_break.level : ''));
  L.push('support: ' + (lv.support.map(z => z.lo + '-' + z.hi + ' x' + z.touches).join(' | ') || 'none') + ' · resistance: ' + (lv.resistance.map(z => z.lo + '-' + z.hi + ' x' + z.touches).join(' | ') || 'none'));
  L.push('liquidity (calculated): ' + (a.liquidity.observations.map(o => o.type + ' @ ' + o.level + (o.swept === false ? ' unswept' : '')).join(' | ') || 'none'));
  L.push('MTF ' + a.multi_timeframe.alignment + ' · ' + a.multi_timeframe.ladder.map(x => x.timeframe + ':' + (x.direction || ('n/a ' + (x.reason || '')))).join(' ') + (a.multi_timeframe.conflicts.length ? ' · CONFLICT ' + a.multi_timeframe.conflicts[0] : ''));
  L.push('caveats: ' + (a.caveats.join('; ') || 'none'));
  return L;
}
for(const [id, sym, tf] of [['miRun','XAUUSD','M15'], ['miRun2','BTCUSD','H1']]){
  $(id).onclick = async () => { const b = $(id); b.disabled = true; $('st').textContent = 'Analysing ' + sym + ' ' + tf + '… (uses cached data where possible)'; try{ mdShow('market-intelligence ' + sym + ' ' + tf, await miAnalyse(sym, tf)); $('st').textContent = 'Done.'; }catch(e){ $('st').textContent = 'Could not reach the function.'; } b.disabled = false; };
}

async function aiCall(body){
  const {data, error} = await sb.functions.invoke('arom-ai', {body});
  if(error){ let code = '', extra = ''; try{ const j = await error.context.json(); code = j && j.error || ''; extra = (j && j.limit ? ' (limit ' + j.limit + ')' : '') + (j && j.missing ? ' (missing secret: ' + j.missing + ')' : ''); }catch(e){} return {error: (code || 'http_error') + extra}; }
  return data;
}
$('aiRun').onclick = async () => {
  const b = $('aiRun'); b.disabled = true; $('st').textContent = 'AROM AI is writing the report… (can take up to a minute)';
  const d = await aiCall({action:'analyze', symbol:'XAUUSD', timeframe:'M15', lang:'en'}), L = [];
  if(d.error) L.push('ERROR ' + d.error);
  else if(d.available === false) L.push('NOT AVAILABLE: ' + d.reason);
  else { const r = d.report; L.push('AI status: ' + r.ai.status + ' · model ' + r.ai.model + ' · from cache ' + r.ai.from_cache + ' · generated ' + r.ai.generated_at, 'engine bias: ' + r.bias + ' · confidence ' + r.confidence + ' · data ' + r.data_timestamp, 'SUMMARY: ' + r.summary, 'STRUCTURE: ' + r.market_structure, 'TREND: ' + r.trend, 'MOMENTUM: ' + r.momentum, 'VOLATILITY: ' + r.volatility, 'BULLISH: ' + r.bullish_scenario, 'BEARISH: ' + r.bearish_scenario, 'INVALIDATION: ' + r.invalidation, 'RISKS: ' + r.risk_notes.join(' | '), 'DATA QUALITY: ' + r.data_quality_notes.join(' | '), 'support: ' + r.support_levels.map(z => z.low + '-' + z.high).join(' | ') + ' · resistance: ' + r.resistance_levels.map(z => z.low + '-' + z.high).join(' | '), 'remaining today: ' + d.remaining); }
  mdShow('AROM AI analyst', L); $('st').textContent = 'Done.'; b.disabled = false;
};
$('aiModels').onclick = async () => {
  const b = $('aiModels'); b.disabled = true; $('st').textContent = 'Asking OpenAI which models your key can use…';
  const d = await aiCall({action:'models'});
  mdShow('OpenAI models', d.error ? ['ERROR ' + d.error] : ['Current OPENAI_MODEL secret: ' + (d.current || '(not set)'), 'Models your key can use (copy ONE name into the Supabase secret OPENAI_MODEL):'].concat(d.models));
  $('st').textContent = 'Done.'; b.disabled = false;
};

async function runBrief(kind, id){
  const b = $(id); b.disabled = true; $('st').textContent = 'Building the ' + kind + ' briefing… the first run can take up to two minutes (it collects data for every instrument).';
  const d = await aiCall({action:'briefing', kind, lang:'en'}), L = [];
  if(d.error) L.push('ERROR ' + d.error);
  else if(d.available === false) L.push('NOT AVAILABLE: ' + d.reason);
  else { const r = d.briefing;
    L.push(r.kind + ' briefing · generated ' + r.generated_at + (r.age_seconds != null ? ' (' + r.age_seconds + 's old, from cache)' : '') + ' · session ' + r.session.current + ' · Cambodia ' + r.session.cambodia_time, 'AI status: ' + r.ai.status + ' · model ' + r.ai.model + (r.ai.replaced_fields.length ? ' · replaced by calculated text: ' + r.ai.replaced_fields.join('; ') : ''),
      'HEADLINE: ' + r.headline, 'OVERVIEW: ' + r.market_overview, 'SESSION: ' + r.session_context, '');
    for(const i of r.instruments){
      if(i.available === false){ L.push(i.symbol + ': UNAVAILABLE (' + i.reason + ')'); continue; }
      L.push(i.symbol + ' [' + i.market_type + '] price ' + i.price + ' · ' + (i.bias || 'bias withheld') + ' · ' + i.alignment + ' · ' + i.freshness + (i.delayed ? ' · DELAYED' : '') + ' · support ' + (i.support ? i.support.low + '-' + i.support.high : 'none') + ' · resistance ' + (i.resistance ? i.resistance.low + '-' + i.resistance.high : 'none') + ' · invalidation ' + (i.invalidation && (i.invalidation.level != null ? i.invalidation.level : i.invalidation.high + '/' + i.invalidation.low)),
        '   ' + i.summary, '   bullish: ' + i.bullish_scenario, '   bearish: ' + i.bearish_scenario, '   risks: ' + (i.risk_notes || []).join(' | ') + (i.source === 'fallback' ? '   [calculated text]' : ''));
    }
    L.push('', 'EVENTS TO WATCH: ' + (r.events_to_watch.map(e => e.event + ' — ' + e.why_it_matters).join(' | ') || 'none'), 'UPCOMING (calendar): ' + (r.upcoming_events == null ? 'calendar unavailable' : (r.upcoming_events.map(e => e.time + ' ' + e.currency + ' ' + e.title + ' (' + e.impact + ')').join(' | ') || 'none in the window')),
      'CROSS-MARKET: ' + (r.cross_market_notes.join(' | ') || '-'), 'RISKS: ' + r.risks.join(' | '), 'DATA QUALITY: ' + r.data_quality_notes.join(' | '), 'remaining today: ' + d.remaining);
  }
  mdShow('AROM AI ' + kind + ' briefing', L); $('st').textContent = 'Done.'; b.disabled = false;
}
$('aiBrief').onclick = () => runBrief('daily', 'aiBrief'); $('aiBriefS').onclick = () => runBrief('session', 'aiBriefS');
let aiConv = null;
$('aiChat').onclick = async () => {
  const b = $('aiChat'); b.disabled = true; $('st').textContent = 'AROM AI is checking the data… (can take up to a minute)';
  const d = await aiCall({action:'chat', message:'What is the current gold bias?', lang:'en', conversation_id: aiConv || undefined}), L = [];
  if(d.error) L.push('ERROR ' + d.error);
  else { aiConv = d.conversation_id; L.push('ANSWER: ' + d.answer, 'status ' + d.ai.status + ' · model ' + d.ai.model, 'tools used: ' + d.tools_called.map(t => t.tool + '(' + JSON.stringify(t.args) + ')' + (t.ok ? '' : ' FAILED')).join(', '), 'data used: ' + d.data_used.join(' | '), 'caveats: ' + d.caveats.join(' | '), 'remaining today: ' + d.remaining); }
  mdShow('AROM AI chat', L); $('st').textContent = 'Done.'; b.disabled = false;
};
$('aiNews').onclick = async () => {
  const b = $('aiNews'); b.disabled = true; $('st').textContent = 'Reading the news… (can take up to a minute)';
  const d = await aiCall({action:'news_explain', symbol:'XAUUSD', lang:'en'}), L = [];
  if(d.error) L.push('ERROR ' + d.error);
  else if(d.available === false) L.push('NOT AVAILABLE: ' + d.reason);
  else { const r = d.report; L.push('status ' + r.ai.status + ' · model ' + r.ai.model + ' · from cache ' + r.ai.from_cache, 'SUMMARY: ' + r.summary); r.headlines.forEach(h => L.push('[' + h.index + '] ' + h.title + ' (' + h.source + ', ' + h.published_at + ')', '   says: ' + h.plain_summary, '   why: ' + h.why_it_may_matter, '   relevance: ' + h.relevance)); L.push('calendar: ' + r.calendar_context, 'caveats: ' + r.caveats.join(' | ')); }
  mdShow('AROM AI news', L); $('st').textContent = 'Done.'; b.disabled = false;
};
$('btns').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if(b) run(b.dataset.p, b, b.dataset.q); });
$('copy').onclick = async () => { try{ await navigator.clipboard.writeText($('ta').value); $('copy').textContent = 'Copied'; }catch(e){ $('ta').select(); $('copy').textContent = 'Select and copy manually'; } };
})();
</script>
</body>
</html>
