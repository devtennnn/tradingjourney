<style>
:root{--bg:#07110c;--panel:#13261f;--panel2:#183027;--line:#2a4636;--lime:#b9f25a;--text:#eef6f0;--muted:#93ab9c;--dim:#6f8a7a;--green:#34d399;--red:#f05b78;--amber:#f5b942;--blue:#8ba8ff;--r:16px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(900px 600px at 85% -10%,rgba(150,210,60,.14),transparent 60%),var(--bg);color:var(--text);font:15px/1.55 Inter,'Kantumruy Pro',system-ui,sans-serif;min-height:100vh}
body.km{font-family:'Kantumruy Pro',Inter,system-ui,sans-serif;line-height:1.75}
a{color:var(--lime);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 56px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;margin:0 -16px 18px;background:rgba(7,17,12,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2.5px;font-size:14px;color:var(--text);white-space:nowrap}.brand img{width:30px;height:30px;border-radius:8px}.brand b{color:var(--lime)}.brand:hover{text-decoration:none}
.top nav{display:flex;gap:4px;margin-left:8px}.top nav a{padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}.top nav a.on{background:rgba(185,242,90,.12);color:var(--lime)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;min-height:38px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--lime);color:#0b1813}
h1{font-size:clamp(24px,4.2vw,34px);line-height:1.15;margin:6px 0 6px;font-weight:900;letter-spacing:-.5px}h1 span{color:var(--lime)}
.sub{color:var(--muted);margin:0 0 16px;max-width:720px}
.card{background:linear-gradient(160deg,var(--panel),#102119);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;min-width:0}
.card h2,.card h3{margin:0 0 10px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--lime);font-weight:800}
body.km .card h2,body.km .card h3{letter-spacing:.4px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-weight:700;font-size:14px;padding:10px 16px;min-height:44px;border-radius:11px;cursor:pointer}.btn:hover{border-color:var(--lime)}.btn[disabled]{opacity:.5;cursor:default}
.btn.pri{background:var(--lime);color:#0b1813;border-color:var(--lime)}a.btn{display:inline-flex;align-items:center;text-decoration:none}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,textarea,input{background:#0c1a14;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:10px 12px;min-height:44px}
select:focus,textarea:focus,input:focus{outline:2px solid rgba(185,242,90,.45);border-color:var(--lime)}
.meta{color:var(--dim);font-size:12.5px}
.chip{display:inline-block;padding:4px 11px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.4px}
.chip.bull{background:rgba(52,211,153,.15);color:var(--green)}.chip.bear{background:rgba(240,91,120,.15);color:var(--red)}.chip.neu{background:rgba(245,185,66,.15);color:var(--amber)}.chip.na{background:rgba(147,171,156,.12);color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(42,70,54,.55);font-size:13.5px}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.hl{font-size:18px;font-weight:800;margin:0 0 8px;line-height:1.3}
p.t{margin:0 0 10px;color:#d6e6dc}
ul.pts{margin:6px 0 0;padding:0;list-style:none}ul.pts li{position:relative;padding:4px 0 4px 20px;font-size:13.5px;color:#cfe0d5}ul.pts li:before{content:'';position:absolute;left:4px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.warn{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.35);color:#f3d79a;border-radius:11px;padding:9px 12px;font-size:12.5px;margin:10px 0}
.err{background:rgba(240,91,120,.1);border:1px solid rgba(240,91,120,.4);color:#ffc2cd;border-radius:12px;padding:14px;margin:14px 0}
.load{display:flex;gap:10px;align-items:center;color:var(--muted);padding:16px 0}.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--lime);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.zone{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(42,70,54,.5);font-size:13px;font-variant-numeric:tabular-nums}.zone:last-child{border:0}.zone i{font-style:normal;color:var(--muted);font-size:11px;text-transform:uppercase}
.ins{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:rgba(12,26,20,.5)}.ins .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.ins .h b{font-size:15px}.ins .px{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.ins details summary{cursor:pointer;color:var(--lime);font-size:12.5px;font-weight:700;margin-top:6px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:rgba(185,242,90,.14);border:1px solid rgba(185,242,90,.3)}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg small{display:block;color:var(--dim);margin-top:6px;white-space:normal}
.sendrow{display:flex;gap:8px}.sendrow textarea{flex:1;min-height:48px;max-height:140px;resize:vertical}
.gate{max-width:520px;margin:30px auto;text-align:center;padding:28px 22px}.gate h2{font-size:18px;letter-spacing:0;text-transform:none;color:var(--text);margin:0 0 8px}.gate p{color:var(--muted);margin:0 0 14px}
.legal{margin-top:22px;color:var(--dim);font-size:12.5px;line-height:1.7}
@media(max-width:700px){.g2{grid-template-columns:1fr}.top nav{display:none}.wrap{padding:0 12px 48px}.top{margin:0 -12px 14px;padding:8px 12px}.brand span.t{display:none}.card{padding:14px}.msg{max-width:100%}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

  return `<div class="card"><div class="hl">${esc(b.headline || '')}</div>${para(b.market_overview)}${b.session_context ? `<div class="meta">${esc(t('sess'))}: ${esc(b.session_context)}</div>` : ''}${aiNote(b.ai)}</div>
    <div class="card"><h2>${esc(t('instruments'))}</h2>${ins}</div>
    ${ev ? `<div class="card"><h2>${esc(t('events'))}</h2><ul class="pts">${ev}</ul></div>` : ''}
    ${(b.cross_market_notes || []).length ? `<div class="card"><h2>${esc(t('cross'))}</h2>${list(b.cross_market_notes)}</div>` : ''}
    ${(b.risks || []).length || (b.data_quality_notes || []).length ? `<div class="card"><h2>${esc(t('risks'))}</h2>${list(b.risks)}${sec(t('dq'), list(b.data_quality_notes))}</div>` : ''}
    ${b.methodology ? `<div class="meta">${esc(b.methodology)}</div>` : ''}`;
}
async function runBrief(){
  if(S.busy.b) return; S.busy.b = 1; $('bGo').disabled = true; $('bOut').innerHTML = loading(t('working')); $('bMeta').textContent = '';
  try{
    const r = await call({action:'briefing', kind:S.kind}), b = r.briefing;
    $('bOut').innerHTML = renderBriefing(b);
    $('bMeta').textContent = `${t('generated')} ${when(b.generated_at)} · ${b.ai && b.ai.from_cache ? t('cached') : t('fresh')}`;
  }catch(e){ $('bOut').innerHTML = errBox(e.code || 'server_error', 'bRetry'); const rb = $('bRetry'); if(rb) rb.onclick = runBrief; }
  S.busy.b = 0; $('bGo').disabled = false;
}

/* ---------- analyst ---------- */
function renderReport(r){
  const mt = r.multi_timeframe || {}, lad = (mt.ladder || []).map(x => `${esc(x.timeframe)} ${esc(x.direction || 'n/a')}`).join(' · ');
  const liq = (r.liquidity_observations || []).map(o => `<li>${esc(String(o.type || '').replace(/_/g, ' '))} @ ${num(o.level)}</li>`).join('');
  const withheld = r.bias == null;
  return `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="hl" style="margin:0">${esc(r.symbol)} · ${esc(r.timeframe)}</div>${biasChip(r.bias)}<span style="margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums">${num(r.price)}</span></div>
    <div class="meta">${esc(t('basis'))}: ${'last completed candle'} · ${esc(t('updated'))} ${esc(when(r.data_timestamp))}${r.freshness && r.freshness.status && r.freshness.status !== 'fresh' ? ' · ' + esc(r.freshness.status) : ''}</div>
    ${para(r.summary)}${r.confidence_note ? `<div class="meta">${esc(r.confidence_note)}</div>` : ''}${aiNote(r.ai, withheld)}</div>
    <div class="g2"><div class="card"><h2>${esc(t('support'))}</h2>${zones(r.support_levels)}</div><div class="card"><h2>${esc(t('resist'))}</h2>${zones(r.resistance_levels)}</div></div>
    <div class="card">
      ${sec(t('struct'), para(r.market_structure))}${sec(t('trend'), para(r.trend))}${sec(t('momentum'), para(r.momentum))}${sec(t('vol'), para(r.volatility))}
      ${liq || (r.liquidity_notes || []).length ? sec(t('liq'), (liq ? `<ul class="pts">${liq}</ul>` : '') + list(r.liquidity_notes)) : ''}
      ${lad ? sec(t('mtf'), `<div class="meta" style="font-size:13px">${lad}${mt.alignment ? ' · ' + esc(String(mt.alignment).replace(/_/g, ' ')) : ''}</div>${list(mt.conflicts)}`) : ''}
    </div>
    <div class="g2"><div class="card"><h2>${esc(t('bull'))}</h2>${para(r.bullish_scenario)}</div><div class="card"><h2>${esc(t('bear'))}</h2>${para(r.bearish_scenario)}</div></div>
    <div class="card">${sec(t('inval'), para(r.invalidation))}${sec(t('risks'), list(r.risk_notes))}${sec(t('dq'), list(r.data_quality_notes))}${sec('', list(r.caveats))}</div>`;
}
async function runAnalyst(){
  if(S.busy.a) return; S.busy.a = 1; $('aGo').disabled = true; $('aOut').innerHTML = loading(t('workingA')); $('aMeta').textContent = '';
  try{
    const r = await call({action:'analyze', symbol:$('aSym').value, timeframe:$('aTf').value});
    if(r.available === false){ $('aOut').innerHTML = `<div class="warn">${esc(t('noData'))}</div>`; }
    else{ $('aOut').innerHTML = renderReport(r.report); const ai = r.report.ai || {}; $('aMeta').textContent = `${t('generated')} ${when(ai.generated_at)} · ${ai.from_cache ? t('cached') : t('fresh')}${r.remaining != null ? ' · ' + t('left') + ': ' + r.remaining : ''}`; }
  }catch(e){ $('aOut').innerHTML = errBox(e.code || 'server_error', 'aRetry'); const rb = $('aRetry'); if(rb) rb.onclick = runAnalyst; }
  S.busy.a = 0; $('aGo').disabled = false;
}

/* ---------- chat ---------- */
function addMsg(role, text, extra){
  const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'u' : 'a'); d.textContent = text;
  if(extra){ const s = document.createElement('small'); s.textContent = extra; d.appendChild(s); }
  $('cLog').appendChild(d); d.scrollIntoView({block:'nearest'}); return d;
}
function refsNote(refs){ if(!refs) return ''; const used = (refs.data_used || []).join('; '), cav = (refs.caveats || []).join(' '); return [used ? t('used') + ': ' + used : '', cav].filter(Boolean).join(' · '); }
async function sendChat(){
  const m = $('cIn').value.trim(); if(!m || S.busy.c) return;
  S.busy.c = 1; $('cSend').disabled = true; $('cIn').value = ''; addMsg('user', m); const w = addMsg('assistant', t('workingC'));
  try{
    const r = await call({action:'chat', message:m, conversation_id:S.conv || undefined});
    S.conv = r.conversation_id; w.remove(); addMsg('assistant', r.answer, refsNote({data_used:r.data_used, caveats:r.caveats}));
    $('cMeta').textContent = r.remaining != null ? t('left') + ': ' + r.remaining : ''; loadHist(true);
  }catch(e){ w.remove(); addMsg('assistant', terr(e.code || 'server_error')); }
  S.busy.c = 0; $('cSend').disabled = false;
}
async function loadHist(keep){
  try{
    const r = await call({action:'conversations'}), sel = $('cHist'), cur = S.conv;
    sel.innerHTML = `<option value="">${esc(t('history'))}</option>` + (r.conversations || []).map(c => `<option value="${esc(c.id)}">${esc((c.title || '…').slice(0, 50))}</option>`).join('');
    if(keep && cur) sel.value = cur;
  }catch(_){}
}
async function openConv(id){
  S.conv = id; $('cLog').innerHTML = '';
  if(!id){ addMsg('assistant', t('chatHint')); return; }
  try{ const r = await call({action:'messages', conversation_id:id}); (r.messages || []).forEach(x => addMsg(x.role, x.content, x.role === 'assistant' ? refsNote(x.data_refs) : '')); }
  catch(e){ addMsg('assistant', terr(e.code)); }
}

/* ---------- news explainer ---------- */
function renderNews(r){
  const rel = {direct:'bull', indirect:'neu', unclear:'na'}, relL = {direct:t('nDirect'), indirect:t('nIndirect'), unclear:t('nUnclear')};
  const heads = (r.headlines || []).map(h => `<div class="ins"><div class="h"><b style="font-size:14px;line-height:1.35">${esc(h.title)}</b>${h.plain_summary ? `<span class="chip ${rel[h.relevance] || 'na'}" style="margin-left:auto">${esc(relL[h.relevance] || '')}</span>` : ''}</div>
    <div class="meta">${esc(h.source || '')}${h.published_at ? ' · ' + esc(when(h.published_at)) : ''}${h.url ? ` · <a href="${esc(h.url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(t('nRead'))}</a>` : ''}</div>
    ${h.plain_summary ? `<div style="margin-top:8px"><h3>${esc(t('nSays'))}</h3>${para(h.plain_summary)}</div>` : (h.summary ? para(h.summary) : '')}
    ${h.why_it_may_matter ? `<div><h3>${esc(t('nWhy'))}</h3>${para(h.why_it_may_matter)}</div>` : ''}</div>`).join('');
  const ev = (r.upcoming_events || []).map(e => `<li>${esc(e.title)} · ${esc(e.currency || '')} · ${esc(e.time || '')}</li>`).join('');
  return `<div class="card"><div class="hl">${esc(r.symbol)}</div>${r.stale ? `<div class="warn">${esc(t('nStale'))}</div>` : ''}${para(r.summary)}${aiNote(r.ai)}</div>
    <div class="card"><h2>${esc(t('tNews'))}</h2>${heads}</div>
    ${r.calendar_context || ev ? `<div class="card"><h2>${esc(t('nCal'))}</h2>${para(r.calendar_context)}${ev ? `<ul class="pts">${ev}</ul>` : ''}</div>` : ''}
    ${(r.caveats || []).length ? `<div class="card">${list(r.caveats)}</div>` : ''}`;
}
async function runNews(){
  if(S.busy.n) return; S.busy.n = 1; $('nGo').disabled = true; $('nOut').innerHTML = loading(t('nWork')); $('nMeta').textContent = '';
  try{
    const r = await call({action:'news_explain', symbol:$('nSym').value});
    if(r.available === false){ $('nOut').innerHTML = `<div class="warn">${esc(r.reason === 'news_provider_not_configured' ? t('nOff') : r.reason === 'news_provider_error' ? t('nErr') : t('nNone'))}</div>`; }
    else{ $('nOut').innerHTML = renderNews(r.report); $('nMeta').textContent = `${t('generated')} ${when(r.report.generated_at)} · ${r.report.ai && r.report.ai.from_cache ? t('cached') : t('fresh')}${r.remaining != null ? ' · ' + t('left') + ': ' + r.remaining : ''}`; }
  }catch(e){ $('nOut').innerHTML = errBox(e.code || 'server_error', 'nRetry'); const rb = $('nRetry'); if(rb) rb.onclick = runNews; }
  S.busy.n = 0; $('nGo').disabled = false;
}

/* ---------- journal review ---------- */
function grpTable(title, a){
  if(!Array.isArray(a) || !a.length) return '';
  return `<div class="card"><h2>${esc(title)}</h2>${a.map(g => `<div class="zone"><span>${esc(g.name)}</span><i>${g.trades} ${esc(t('jTr'))} · ${num(g.win_rate_pct)}% · ${num(g.total_pl)}</i></div>`).join('')}</div>`;
}
function renderJournal(r){
  const s = r.stats, kv = (l, v) => `<div class="kv"><span>${esc(l)}</span><b>${v == null ? '—' : esc(v)}</b></div>`;
  const ai = r.ai || {}, pts = (title, a) => Array.isArray(a) && a.length ? `<div class="card"><h2>${esc(title)}</h2>${list(a)}</div>` : '';
  return `<div class="card"><div class="hl">${esc(r.summary || '')}</div>${ai.status === 'ok' ? '' : `<div class="meta">${esc(t('jAiNo'))}</div>`}${s.sample_note ? `<div class="warn">${esc(s.sample_note)}</div>` : ''}</div>
    <div class="g2"><div class="card"><h2>${esc(t('jTrades'))}</h2>${kv(t('jTrades'), s.trades)}${kv(t('jWin'), num(s.win_rate_pct) + '%')}${kv(t('jTot'), num(s.total_pl))}${kv(t('jAvgW'), s.average_win == null ? null : num(s.average_win))}${kv(t('jAvgL'), s.average_loss == null ? null : num(s.average_loss))}</div>
    <div class="card"><h2>&nbsp;</h2>${kv(t('jPf'), s.profit_factor == null ? null : num(s.profit_factor))}${kv(t('jExp'), num(s.expectancy_per_trade))}${kv(t('jAvgR'), s.average_r == null ? null : num(s.average_r))}${kv(t('jStreak'), s.max_consecutive_losses)}</div></div>
    ${pts(t('jStr'), r.strengths)}${pts(t('jWk'), r.weaknesses)}${pts(t('jPat'), r.patterns)}${pts(t('jSug'), r.suggestions)}${pts(t('jNotes'), r.data_notes)}
    <div class="g2">${grpTable(t('jSym'), s.by_symbol)}${grpTable(t('jSes'), s.by_session)}${grpTable(t('jSet'), s.by_setup)}${grpTable(t('jDay'), s.by_weekday)}</div>`;
}
async function runJournal(){
  if(S.busy.j) return; S.busy.j = 1; $('jGo').disabled = true; $('jOut').innerHTML = loading(t('jWork')); $('jMeta').textContent = '';
  try{
    const d = (document.querySelector('#jDays button.on') || {dataset:{d:30}}).dataset.d, r = await call({action:'journal_review', days:+d});
    if(r.available === false){ $('jOut').innerHTML = `<div class="warn">${esc(t('jNone'))}</div>`; }
    else{ $('jOut').innerHTML = renderJournal(r.review); $('jMeta').textContent = `${t('generated')} ${when(r.review.ai && r.review.ai.generated_at)}${r.remaining != null ? ' · ' + t('left') + ': ' + r.remaining : ''}`; }
  }catch(e){ $('jOut').innerHTML = errBox(e.code || 'server_error', 'jRetry'); const rb = $('jRetry'); if(rb) rb.onclick = runJournal; }
  S.busy.j = 0; $('jGo').disabled = false;
}

/* ---------- shell ---------- */
function paint(){
  document.body.classList.toggle('km', S.lang === 'km'); document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang));
  const tabs = {brief:'tBrief', analyst:'tAnalyst', chat:'tChat', news:'tNews', journal:'tJournal'}; document.querySelectorAll('#tabs button').forEach(b => { b.textContent = t(tabs[b.dataset.t]); });
  document.querySelectorAll('#bKind button').forEach(b => { b.textContent = t(b.dataset.k); });
  document.querySelectorAll('#jDays button').forEach(b => { b.textContent = t('jD' + b.dataset.d); }); $('jGo').textContent = t('jGo'); $('nGo').textContent = t('nGo');
  $('bGo').textContent = t('make'); $('aGo').textContent = t('analyse'); $('cNew').textContent = t('newChat'); $('cSend').textContent = t('send'); $('cIn').placeholder = t('chatPh');
  const h = $('cHist').options[0]; if(h) h.textContent = t('history');
}
function resetOutputs(){   // generated text is in the language it was made in: clear it on a language switch instead of showing a mix
  ['bOut','aOut'].forEach(id => { const e = $(id); if(e) e.innerHTML = ''; }); $('nOut').innerHTML = `<p class="meta">${esc(t('nHint'))}</p>`; $('jOut').innerHTML = `<p class="meta">${esc(t('jHint'))}</p>`; ['bMeta','aMeta','nMeta','jMeta'].forEach(id => { const e = $(id); if(e) e.textContent = ''; });
}
function show(tab){
  S.tab = tab; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('pBrief').hidden = tab !== 'brief'; $('pAnalyst').hidden = tab !== 'analyst'; $('pChat').hidden = tab !== 'chat'; $('pJournal').hidden = tab !== 'journal'; $('pNews').hidden = tab !== 'news';
  if(tab === 'chat' && !$('cLog').children.length){ openConv(null); loadHist(); }
}
function gate(kind){
  const g = $('gate'); g.hidden = false; $('app').hidden = true;
  if(kind === 'load'){ g.innerHTML = loading(t('gLoad')); return; }
  const signed = kind === 'ultra';
  g.innerHTML = `<h2>${esc(signed ? t('gUpT') : t('gSignT'))}</h2><p>${esc(signed ? t('gUpP') : t('gSignP'))}</p><a class="btn pri" href="${signed ? '/pricing' : '/'}">${esc(signed ? t('gUpB') : t('gSignB'))}</a>`;
}
async function boot(){
  paint(); gate('load');
  let session = null; try{ session = (await sb.auth.getSession()).data.session; }catch(_){}
  if(!session){ gate('signin'); return; }
  let ok = false;
  try{ const {data:p} = await sb.from('profiles').select('is_admin,ultra_until').eq('id', session.user.id).maybeSingle(); ok = !!(p && (p.is_admin === true || (p.ultra_until && new Date(p.ultra_until) > new Date()))); }catch(_){}
  if(!ok){ gate('ultra'); return; }
  $('gate').hidden = true; $('app').hidden = false;
  $('aSym').innerHTML = SYMS.map(s => `<option>${s}</option>`).join(''); $('nSym').innerHTML = SYMS.map(s => `<option>${s}</option>`).join(''); $('aTf').innerHTML = TFS.map(x => `<option${x === 'H1' ? ' selected' : ''}>${x}</option>`).join('');
  show('brief');
}
$('langSeg').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if(!b) return; S.lang = b.dataset.l; try{ localStorage.setItem('arom_lang', S.lang); }catch(_){} resetOutputs(); paint(); if($('gate') && !$('gate').hidden) boot(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if(b) show(b.dataset.t); });
$('bKind').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if(!b) return; S.kind = b.dataset.k; document.querySelectorAll('#bKind button').forEach(x => x.classList.toggle('on', x === b)); });
$('jDays').addEventListener('click', e => { const b = e.target.closest('button[data-d]'); if(!b) return; document.querySelectorAll('#jDays button').forEach(x => x.classList.toggle('on', x === b)); });
$('jGo').addEventListener('click', runJournal); $('nGo').addEventListener('click', runNews);
$('bGo').addEventListener('click', runBrief); $('aGo').addEventListener('click', runAnalyst);
$('cSend').addEventListener('click', sendChat); $('cIn').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });
$('cNew').addEventListener('click', () => { $('cHist').value = ''; openConv(null); });
$('cHist').addEventListener('change', e => openConv(e.target.value || null));
boot();
})();
</script>
</body>
</html>
