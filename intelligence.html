<style>
:root{--bg:#07110c;--bg2:#0b1813;--panel:#13261f;--panel2:#183027;--line:#2a4636;--lime:#b9f25a;--lime2:#d6ff86;--text:#eef6f0;--muted:#93ab9c;--dim:#6f8a7a;--green:#34d399;--red:#f05b78;--amber:#f5b942;--blue:#8ba8ff;--r:16px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 600px at 85% -10%,rgba(150,210,60,.14),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(60,140,90,.12),transparent 60%),var(--bg);color:var(--text);font:15px/1.55 Inter,'Kantumruy Pro',system-ui,sans-serif;min-height:100vh}
body.km{font-family:'Kantumruy Pro',Inter,system-ui,sans-serif;line-height:1.75}
a{color:var(--lime);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 16px;margin:0 -16px 18px;background:rgba(7,17,12,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2.5px;font-size:14px;color:var(--text);white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:8px}.brand b{color:var(--lime)}
.top nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.top nav a{padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.top nav a.on{background:rgba(185,242,90,.12);color:var(--lime)}.top nav a:hover{text-decoration:none;color:var(--text)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--lime);color:#0b1813}.seg button:hover:not(.on){color:var(--text)}
/* hero */
h1{font-size:clamp(24px,4.2vw,36px);line-height:1.15;margin:6px 0 6px;font-weight:900;letter-spacing:-.5px}h1 span{color:var(--lime)}
.sub{color:var(--muted);margin:0 0 16px;max-width:760px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl .meta{color:var(--dim);font-size:12.5px;margin-left:auto}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer}.btn:hover{border-color:var(--lime)}.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;gap:14px}
.g-hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.g-mod{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:linear-gradient(160deg,var(--panel),#102119);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;min-width:0}
.card h2,.card h3{margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-weight:800}
body.km .card h2,body.km .card h3{letter-spacing:.5px}
.gauge{display:block;margin:0 auto;max-width:300px;width:100%}
.act{text-align:center;margin-top:-4px}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:800;font-size:12.5px;letter-spacing:.5px}
.chip.long{background:rgba(52,211,153,.15);color:var(--green)}.chip.short{background:rgba(240,91,120,.15);color:var(--red)}.chip.wait{background:rgba(245,185,66,.15);color:var(--amber)}
.chip.na{background:rgba(147,171,156,.12);color:var(--muted)}.chip.gate{background:rgba(139,168,255,.14);color:var(--blue)}
.big{font-size:30px;font-weight:900;margin:2px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(42,70,54,.55);font-size:13.5px}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--amber)}
ul.pts{margin:6px 0 0;padding:0;list-style:none}ul.pts li{position:relative;padding:5px 0 5px 22px;font-size:13.5px;color:#cfe0d5}
ul.pts li:before{content:'';position:absolute;left:4px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--green)}
ul.pts.con li:before{background:var(--red)}ul.pts.wt li:before{background:var(--amber)}
.hl{font-size:16px;font-weight:700;margin:0 0 6px}
.warn{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.35);color:#f3d79a;border-radius:11px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.err{background:rgba(240,91,120,.1);border:1px solid rgba(240,91,120,.4);color:#ffc2cd;border-radius:12px;padding:14px;margin:14px 0}
/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font:10px Inter,sans-serif;fill:var(--muted)}
/* modules */
.mod .top2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mod .no{width:26px;height:26px;border-radius:8px;background:rgba(185,242,90,.12);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.mod .nm{font-weight:800;font-size:14.5px;line-height:1.2}.mod .tfc{font-size:11px;color:var(--dim);font-weight:600}
.mod .w{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.bar{position:relative;height:8px;border-radius:99px;background:#0c1a14;border:1px solid var(--line);margin:8px 0 4px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}.bar:after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim)}
.mod .sc{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.mod ul{margin:8px 0 0;padding:0;list-style:none;font-size:12.8px;color:#cfe0d5}.mod li{padding:3px 0;border-top:1px dashed rgba(42,70,54,.6)}.mod li:first-child{border-top:0}
.mod .desc{font-size:12px;color:var(--dim);margin-top:8px}
.mod.off{opacity:.62}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid rgba(42,70,54,.5)}table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.legal{margin-top:22px;color:var(--dim);font-size:12.5px;line-height:1.7}
.skel{height:120px;border-radius:12px;background:linear-gradient(90deg,#102119 25%,#16302a 50%,#102119 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.gate{max-width:560px;margin:30px auto;text-align:center;padding:30px 22px}.gate .lock{font-size:34px;margin-bottom:6px}.gate h2{font-size:18px;letter-spacing:0;text-transform:none;color:var(--text);margin:0 0 8px}
.gate p{color:var(--muted);margin:0 0 14px}.gmods{list-style:none;margin:0 auto 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.gmods li{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;color:#cfe0d5}
.gprice{font-size:15px;color:var(--muted);margin-bottom:14px}.gprice b{font-size:28px;color:var(--lime);font-weight:900}.gate-b{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn.pri{background:var(--lime);color:#0b1813;border-color:var(--lime)}a.btn{display:inline-block;text-decoration:none}a.btn:hover{text-decoration:none}.gnote{font-size:12.5px;margin:14px 0 0!important;color:var(--dim)!important}
/* chart upload */
.mode{margin:0 0 14px}
.up{display:grid;gap:14px;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.drop{border:2px dashed var(--line);border-radius:14px;min-height:210px;display:grid;place-items:center;text-align:center;padding:14px;cursor:pointer;background:rgba(12,26,20,.5);color:var(--muted);transition:border-color .15s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--lime);outline:0}
.drop img{max-width:100%;max-height:340px;border-radius:10px;display:block;margin:0 auto}
.drop b{color:var(--text)}.drop small{display:block;color:var(--dim);margin-top:4px}
.fld{display:grid;gap:5px;margin-bottom:10px}.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;background:#0c1a14;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:9px 11px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid rgba(185,242,90,.45);border-color:var(--lime)}
.fld textarea{min-height:76px;resize:vertical}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#cfe0d5;margin:4px 0 10px;cursor:pointer}.chk input{margin-top:3px;accent-color:var(--lime)}
.note{font-size:12px;color:var(--dim);margin:8px 0 0}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cres{margin-top:14px}
.cres .mods{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:12px}
.lvl{display:flex;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(42,70,54,.5);font-size:13px}.lvl:last-child{border:0}.lvl i{font-style:normal;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.lvl b{font-variant-numeric:tabular-nums}
.load{display:flex;gap:10px;align-items:center;color:var(--muted);padding:16px 0}.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--lime);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:900px){.up{grid-template-columns:1fr}}
@media(max-width:520px){.row3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:900px){.g-hero{grid-template-columns:1fr}.top nav{display:none}}
@media(max-width:520px){.wrap{padding:0 12px 48px}.top{margin:0 -12px 14px;padding:8px 12px}.brand span.t{display:none}.card{padding:14px}.seg button{padding:6px 9px}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style>

    <div class="sc"><span class="chip ${CLS(m.verdict)}">${esc(VW(m.verdict))}</span><b class="${m.score > 15 ? 'pos' : m.score < -15 ? 'neg' : 'neu'}">${m.verdict === 'unavailable' ? '—' : (m.score > 0 ? '+' : '') + m.score}</b></div>
    ${m.verdict === 'unavailable' ? '' : bar(m.score / 100, true)}${m.notes.length ? `<ul>${m.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`).join('');
  const lv = a.levels.length ? `<div class="card" style="margin-top:12px"><h2>${t('cuLevels')}</h2>${a.levels.map(l => `<div class="lvl"><span><i>${esc(l.type.replace(/_/g, ' '))}</i> ${esc(l.note)}</span><b>${l.price == null ? '—' : fp(l.price, a.detected.last_price || l.price)}</b></div>`).join('')}${a.detected.price_scale_readable ? `<p class="note">${t('cuApprox')}</p>` : ''}</div>` : '';
  const pl = a.plan; const plan = pl.valid ? `<div class="kv"><span>${esc(pl.direction)} · ${t('entry')}</span><b>${P(pl.entry)}</b></div><div class="kv"><span>${t('stop')}</span><b class="neg">${P(pl.stop)}</b></div>${pl.targets.map((x, i) => `<div class="kv"><span>${t('tp')} ${i + 1}</span><b class="pos">${P(x)}</b></div>`).join('')}${pl.rr != null ? `<div class="kv"><span>${t('rr')}</span><b>1 : ${pl.rr}</b></div>` : ''}${pl.note ? `<p class="note">${esc(pl.note)}</p>` : ''}` : `<div style="color:var(--muted);font-size:13.5px">${t('cuNoPlan')}${pl.note ? `<br><span style="color:var(--dim);font-size:12.5px">${esc(pl.note)}</span>` : ''}</div>`;
  const e = r.engine, eng = e ? `<div class="kv"><span>${t('cuEng')} · ${esc(e.symbol)}</span><b>${esc(L[S.lang].action[e.action] || e.action)}${e.grade ? ' · ' + esc(e.grade) : ''} (${e.score > 0 ? '+' : ''}${esc(e.score)})</b></div>` : '';
  return `<div class="cres"><div class="grid g-hero"><div class="card"><h2>${t('cuBias')}</h2><div class="act"><span class="chip ${ch}" style="font-size:15px;padding:7px 18px">${esc(L[S.lang].action[a.bias])}</span>
      <div class="kv" style="margin-top:12px"><span>${t('cuConf')}</span><b>${a.confidence}%</b></div>
      <div class="kv"><span>${t('cuDetected')}</span><b>${esc(a.detected.symbol || '—')} · ${esc(a.detected.timeframe || '—')}</b></div>${eng}</div></div>
    <div class="card"><h2>${t('why')}</h2><p class="hl">${esc(a.headline)}</p>
      ${a.idea_review ? `<h3 style="margin-top:10px">${t('cuIdea')}</h3><p style="margin:0;font-size:13.5px;color:#cfe0d5">${esc(a.idea_review)}</p>` : ''}
      ${a.pros.length ? `<h3 style="margin-top:12px">${t('cuPros')}</h3>${ul(a.pros, '')}` : ''}${a.cons.length ? `<h3 style="margin-top:12px">${t('cuCons')}</h3>${ul(a.cons, 'con')}` : ''}</div></div>
    <h2 style="margin:20px 0 4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--lime)">${t('cuMods')}</h2><div class="mods">${mods}</div>
    <div class="grid g-hero" style="margin-top:12px"><div class="card"><h2>${t('cuPlan')}</h2>${plan}</div><div>${lv ? lv.replace(' style="margin-top:12px"', '') : ''}</div></div>
    ${a.next_steps.length || a.cannot_determine.length ? `<div class="card" style="margin-top:12px">${a.next_steps.length ? `<h2>${t('cuNext')}</h2>${ul(a.next_steps, '')}` : ''}${a.cannot_determine.length ? `<h3 style="margin-top:12px">${t('cuCant')}</h3>${ul(a.cannot_determine, 'wt')}` : ''}</div>` : ''}
  </div>`;
}
function drawChart(){
  const el = $('chartTool'), K = L[S.lang];
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
  el.innerHTML = `<div class="card"><h2>${t('cuT')}</h2><p style="margin:0 0 12px;color:var(--muted);font-size:13.5px">${t('cuSub')}</p>
  <div class="up"><div>
    <div class="drop" id="cDrop" role="button" tabindex="0" aria-label="${esc(t('cuDrop'))}">${C.dataUrl ? `<div><img src="${C.dataUrl}" alt="">` + `</div>` : `<div><b>${t('cuDrop')}</b><small>${t('cuDropS')}</small></div>`}</div>
    <input type="file" id="cFile" accept="image/png,image/jpeg,image/webp" hidden>
    <div class="mini" style="margin-top:8px">${C.dataUrl ? `<button class="btn" id="cChange" type="button">${t('cuChange')}</button><button class="btn" id="cClear" type="button">${t('cuRemove')}</button>` : ''}</div>
    <p class="note">${t('cuPrivacy')}</p></div>
  <div>
    <div class="row3"><div class="fld"><label for="cSym">${t('cuMarket')}</label><select id="cSym">${opt('', t('cuAuto'), C.sym)}${SYMS.map(x => opt(x, x, C.sym)).join('')}</select></div>
      <div class="fld"><label for="cTf">${t('cuTf')}</label><select id="cTf">${opt('', t('cuAuto'), C.tf)}${TFL.map(x => opt(x, x, C.tf)).join('')}</select></div>
      <div class="fld"><label for="cStyle">${t('cuStyle')}</label><select id="cStyle">${STYLES.map(x => opt(x, t(x), C.style || S.style)).join('')}</select></div></div>
    <div class="fld"><label for="cNotes">${t('cuNotes')}</label><textarea id="cNotes" maxlength="1200" placeholder="${esc(t('cuNotesPh'))}">${esc(C.notes)}</textarea></div>
    <div class="row3"><div class="fld"><label for="cEntry">${t('cuEntry')} (${t('cuOptional')})</label><input id="cEntry" inputmode="decimal" value="${esc(C.entry)}"></div>
      <div class="fld"><label for="cSl">${t('cuSl')} (${t('cuOptional')})</label><input id="cSl" inputmode="decimal" value="${esc(C.sl)}"></div>
      <div class="fld"><label for="cTp">${t('cuTp')} (${t('cuOptional')})</label><input id="cTp" inputmode="decimal" value="${esc(C.tp)}"></div></div>
    <label class="chk"><input type="checkbox" id="cEng"${C.eng ? ' checked' : ''}><span>${t('cuEngine')}</span></label>
    <button class="btn pri" id="cGo" type="button"${C.busy ? ' disabled' : ''}>${C.busy ? t('cuBusy') : t('cuGo')}</button>
    ${C.left != null ? `<span class="note" style="margin-left:10px">${C.left} ${t('cuLeft')}</span>` : ''}
    ${C.err ? `<div class="err" role="alert" style="margin-top:12px">${esc(C.err)}</div>` : ''}
  </div></div></div>
  ${C.busy ? `<div class="load" role="status"><span class="spin"></span>${t('cuBusy')}</div>` : C.res ? chartResultHtml(C.res) : ''}`;
  const g = id => $(id), file = g('cFile'), drop = g('cDrop');
  const bind = (id, k) => { const n = g(id); if(n) n.oninput = () => { C[k] = n.value; }; };
  bind('cSym','sym'); bind('cTf','tf'); bind('cStyle','style'); bind('cNotes','notes'); bind('cEntry','entry'); bind('cSl','sl'); bind('cTp','tp');
  g('cEng').onchange = () => { C.eng = g('cEng').checked; };
  drop.onclick = () => file.click(); drop.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); file.click(); } };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) takeFile(f); });
  file.onchange = () => { if(file.files[0]) takeFile(file.files[0]); file.value = ''; };
  const ch = g('cChange'); if(ch) ch.onclick = () => file.click();
  const cl = g('cClear'); if(cl) cl.onclick = () => { C.img = null; C.dataUrl = ''; C.res = null; C.err = ''; drawChart(); };
  g('cGo').onclick = analyseChart;
}
/** shrink in the browser: long edge ≤ 2000 px, JPEG, ideally under ~1.5 MB (the server limit is about 5 MB) */
function shrink(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      try{
        let edge = 2000, q = 0.88, out = null;
        for(let i = 0; i < 5; i++){
          const sc = Math.min(1, edge / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc));
          const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if(out.length < 2_000_000) break; edge = Math.round(edge * 0.8); q = Math.max(0.7, q - 0.06);
        }
        URL.revokeObjectURL(url); ok(out);
      }catch(e){ URL.revokeObjectURL(url); no(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('decode')); };
    im.src = url;
  });
}
async function takeFile(f){
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){ C.err = t('cuBadImg'); drawChart(); return; }
  try{ C.dataUrl = await shrink(f); C.img = C.dataUrl.split(',')[1]; C.err = ''; C.res = null; }
  catch(e){ C.err = t('cuBadImg'); }
  drawChart();
}
document.addEventListener('paste', e => {
  if(S.mode !== 'chart' || S.gate || C.busy) return;
  const it = [...(e.clipboardData && e.clipboardData.items || [])].find(x => x.kind === 'file' && /^image\//.test(x.type));
  if(it){ const f = it.getAsFile(); if(f){ e.preventDefault(); takeFile(f); } }
});
const CERR = {daily_limit:'cuLimit', busy:'cuBusySrv', not_configured:'cuNotCfg', setup_needed:'cuSetup', bad_image:'cuBadImg', too_large:'cuBig', refused:'cuRefused', slow_down:'slow'};
async function analyseChart(){
  if(C.busy) return;
  if(!C.img){ C.err = t('cuNeedImg'); drawChart(); return; }
  C.busy = true; C.err = ''; C.res = null; drawChart();
  try{
    const res = await sb.functions.invoke('intelligence-chart', {body:{image:C.img, media_type:'image/jpeg', symbol:C.sym, timeframe:C.tf, style:C.style || S.style, notes:C.notes, entry:C.entry, sl:C.sl, tp:C.tp, lang:S.lang, use_engine:!!(C.eng && C.sym)}});
    if(res.error){
      const {status, code} = await errCode(res.error);
      if(status === 401 || code === 'unauthorized'){ S.gate = 'signin'; C.busy = false; render(); return; }
      if(status === 403 || code === 'ultra_required'){ S.gate = 'upsell'; C.busy = false; render(); return; }
      C.err = t(CERR[code]) || t('cuFail');
    } else if(res.data && res.data.ok){ C.res = res.data; C.left = res.data.remaining; }
    else C.err = t(CERR[res.data && res.data.error]) || t('cuFail');
  }catch(e){ C.err = t('cuFail'); }
  C.busy = false; drawChart();
}

/* ---------------- controls ---------------- */
function drawControls(){
  $('modeSeg').innerHTML = ['engine','chart'].map(m => `<button type="button" data-m="${m}" class="${m === S.mode ? 'on' : ''}">${t(m === 'engine' ? 'cmEngine' : 'cmChart')}</button>`).join('');
  $('symSeg').innerHTML = SYMS.map(s => `<button type="button" data-s="${s}" class="${s === S.sym ? 'on' : ''}">${s}</button>`).join('');
  $('styleSeg').innerHTML = STYLES.map(s => `<button type="button" data-st="${s}" class="${s === S.style ? 'on' : ''}">${t(s)}</button>`).join('');
  document.querySelectorAll('[data-i]').forEach(a => { a.textContent = t(a.dataset.i); });
  $('sub').textContent = t('sub'); $('legal').textContent = t('legal'); $('refresh').textContent = S.loading ? t('loading') : t('refresh');
  document.body.classList.toggle('km', km()); document.documentElement.lang = S.lang;
  $('langSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang));
}
$('symSeg').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if(!b || b.dataset.s === S.sym) return; S.sym = b.dataset.s; save(); drawControls(); load(true); });
$('styleSeg').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if(!b || b.dataset.st === S.style) return; S.style = b.dataset.st; save(); drawControls(); load(true); });
$('langSeg').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if(!b) return; S.lang = b.dataset.l; save(); drawControls(); render(); meta(); });
$('modeSeg').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if(!b || b.dataset.m === S.mode) return; S.mode = b.dataset.m; drawControls(); render(); if(S.mode === 'engine' && !S.loading && Date.now() - S.at > 55000) load(false); });
$('refresh').onclick = () => load(true);
drawControls(); load(true);
setInterval(() => { if(S.mode === 'engine' && !document.hidden && !S.loading && Date.now() - S.at > 55000) load(false); }, 20000);
window.__intel = S; window.__chart = C;
})();
